name: Backend CI Pipeline

on:
  push:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Verify backend folder exists (debug step)
      - name: List files
        run: ls -R

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
              -u "${{ secrets.DOCKER_USERNAME }}" \
              --password-stdin

      # 4. Build Docker image
      - name: Build Docker image
        run: docker build -t 90145/backend-app:latest ./backend

      # 5. Push Docker image
      - name: Push Docker image
        run: docker push 90145/backend-app:latest
